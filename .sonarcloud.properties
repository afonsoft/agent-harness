# SonarCloud Automatic Analysis configuration (CI analysis is inactive:
# SONAR_TOKEN is not set, so the code-quality job self-skips; the
# "SonarCloud Code Analysis" PR check comes from Automatic Analysis).
#
# Exclude the Dockerfile from analysis. docker:S8431 ("use either the
# version tag or the digest") flags the `image:tag@sha256:` base refs and
# fails the quality gate on every dependabot digest bump. The tag+digest
# combination is intentional and required: the digest is the
# supply-chain pin mandated by SPEC-20261003-ops-hardening RF-001, and
# the tag is how dependabot knows which channel to track. Issue-scoped
# ignores (sonar.issue.ignore.*) are not readable from this file — they
# must be set in the SonarCloud project settings — so a file exclusion
# is the only in-repo mechanism.
sonar.exclusions=**/Dockerfile*,**/docker-compose*.yml,**/compose*.yml
