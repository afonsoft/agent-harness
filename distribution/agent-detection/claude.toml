id = "claude"
version = "2026.11.05.1"
min_engine_version = 1
updated_at = "2026-11-05T00:00:00Z"
aliases = ["claude-code"]

[[rules]]
id = "esc_interrupt_working"
state = "working"
priority = 900
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["esc to interrupt"]

[[rules]]
id = "spinner_line_working"
state = "working"
priority = 850
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['^\s*[✳✻✶✢·\*]\s+\S.*…']
not = [
  { contains = ["esc to cancel"] },
]

[[rules]]
id = "permission_form"
state = "blocked"
priority = 800
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { line_regex = ['(?i)^\s*❯?\s*\d*\.*\s*yes\b'] },
  { line_regex = ['(?i)^\s*❯?\s*\d*\.*\s*no\b'] },
]

[[rules]]
id = "enter_select_footer"
state = "blocked"
priority = 780
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["esc to cancel"]
any = [
  { contains = ["enter to select"] },
  { contains = ["enter to confirm"] },
  { contains = ["tab to amend"] },
]

[[rules]]
id = "permission_to_use"
state = "blocked"
priority = 760
region = "bottom_non_empty_lines(10)"
visible_blocker = true
line_regex = ['(?i)permission to use .+\?']

[[rules]]
id = "legacy_permission_ask"
state = "blocked"
priority = 600
region = "bottom_non_empty_lines(8)"
visible_blocker = true
any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["do you want to allow"] },
  { contains = ["waiting for permission"] },
]

[[rules]]
id = "input_prompt_idle"
state = "idle"
priority = 500
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
]
