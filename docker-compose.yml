# Agent Harness — self-hosted single-container deployment.
# All persistent state lives in the `taskboard-data` volume mounted at /data:
#   /data/harness.sqlite    — database + configuration overrides
#   /data/admin.json         — generated admin credentials
#   /data/skills-cache/      — skills repository cache
#   /data/home/              — $HOME of the container: CLI credentials
#                              (.claude, .codex, .config/...) and the agent
#                              workspace ~/repos → /data/home/repos
#
# Run:  cp .env.example .env   (optional)  &&  docker compose up -d
services:
  harness:
    build: .
    image: agent-harness:latest
    container_name: agent-harness
    ports:
      - "47823:47823"
    environment:
      # Admin login password; leave empty to auto-generate — the generated
      # password is written to /data/.admin-password inside the volume:
      #   docker compose exec harness cat /data/.admin-password
      Admin__Password: ${ADMIN_PASSWORD:-}
      # GitHub PAT (repo, read:org) for the Kanban board — optional.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # ACP session-per-run for board/cockpit agent executions (SPEC-20260921-acp-v1-conformance
      # RF-010): when "true", one-shot runs go through a real ACP session
      # (initialize → session/new → session/prompt) instead of args-mode.
      # HARNESS__ACP__SESSIONRUNS: ${ACP_SESSION_RUNS:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - taskboard-data:/data
      # Opt-in: bind the server's real repos so agents/terminal/cockpit work on
      # them directly. Uncomment and set HARNESS_REPOS_DIR in .env:
      # - ${HARNESS_REPOS_DIR}:/data/home/repos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:47823/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Test runner (opt-in) ────────────────────────────────────────────────
  # The `test` target already ran format-verify + the full test suite during
  # the image build (a red suite fails the build). This service re-runs the
  # suites inside the container for a visible report / quick re-run:
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: agent-harness:test
    working_dir: /src
    entrypoint: ["dotnet", "test", "Taskboard.sln", "-c", "Release", "--no-build", "--nologo"]

  # ── Static validation (opt-in) — same gates as CI ───────────────────────
  #   docker compose --profile validate run --rm validate
  validate:
    profiles: ["validate"]
    build:
      context: .
      target: build
    image: agent-harness:build
    working_dir: /src
    entrypoint:
      [
        "sh", "-c",
        "dotnet format Taskboard.sln --verify-no-changes --no-restore --severity warn \
          && dotnet build Taskboard.sln -c Release --no-restore",
      ]

volumes:
  # Legacy name kept intentionally — renaming orphans existing volumes
  # (SPEC-20260922-harness-home-rename RF-008).
  taskboard-data:

# ── Scheduled backups (opt-in, SPEC-20261003-sqlite-backup) ─────────────
# `taskctl` ships inside the image — a host cron drives online-consistent
# VACUUM INTO snapshots of /data/harness.sqlite:
#   # /etc/cron.d/harness-backup — daily 03:30, keep 14 copies
#   30 3 * * * root docker compose -f /opt/agent-harness/docker-compose.yml \
#       exec -T harness taskctl backup /data/backups --keep 14
# Restore: stop the service, then
#   docker compose run --rm --no-deps -T --entrypoint taskctl harness \
#       restore /data/backups/<file>.sqlite --force
# See docs/installation.md → "Backup & restore".
