name: .NET Build and Test

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.props'
      - 'global.json'
      - '.editorconfig'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.props'
      - 'global.json'
      - '.editorconfig'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_FILE: Taskboard.sln
  COVERAGE_THRESHOLD: 80
  BRANCH_COVERAGE_THRESHOLD: 45

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "GitHubActions"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Coverage report & threshold
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"Cobertura;MarkdownSummaryGithub" \
            -assemblyfilters:"-*.Tests.*"
          cat TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' TestResults/CoverageReport/Cobertura.xml | head -1)
          COVERAGE=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r * 100 }')
          echo "Line coverage: ${COVERAGE}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v c="$COVERAGE" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit (c + 0 >= t + 0) ? 0 : 1 }' \
            || { echo "::error::Line coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"; exit 1; }
          BRANCH_RATE=$(grep -oP 'branch-rate="\K[0-9.]+' TestResults/CoverageReport/Cobertura.xml | head -1)
          BRANCH_COVERAGE=$(awk -v r="$BRANCH_RATE" 'BEGIN { printf "%.2f", r * 100 }')
          echo "Branch coverage: ${BRANCH_COVERAGE}% (threshold: ${BRANCH_COVERAGE_THRESHOLD}%)"
          awk -v c="$BRANCH_COVERAGE" -v t="$BRANCH_COVERAGE_THRESHOLD" 'BEGIN { exit (c + 0 >= t + 0) ? 0 : 1 }' \
            || { echo "::error::Branch coverage ${BRANCH_COVERAGE}% is below threshold ${BRANCH_COVERAGE_THRESHOLD}%"; exit 1; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          retention-days: 14
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/CoverageReport/**

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          files: TestResults/CoverageReport/Cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  vulnerabilities:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Check vulnerable packages
        run: |
          dotnet list ${{ env.SOLUTION_FILE }} package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE 'Severity|has the following vulnerable packages' vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
