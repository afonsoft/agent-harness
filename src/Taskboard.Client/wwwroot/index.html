<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Harness</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link href="_content/Blazor.Bootstrap/blazor.bootstrap.css" rel="stylesheet" />
    <link rel="stylesheet" href="lib/xterm/xterm.css" />
    <link rel="stylesheet" href="lib/highlight/github-dark.min.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link href="Taskboard.Client.styles.css" rel="stylesheet" />
    <script>
        // SPEC-20260918-sidebar-icon-rail RF-002: restore the collapsed-rail
        // flag before Blazor renders so the sidebar paints collapsed without
        // a flash. Inert below the `lg` breakpoint (all rail CSS is also
        // gated on a min-width media query).
        try {
            if (localStorage.getItem('harness.sidebar.collapsed') === 'true')
                document.documentElement.dataset.sidebarCollapsed = 'true';
        } catch (e) { /* storage unavailable — sidebar stays expanded */ }
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="error-details-toggle">Details</button>
        <span class="dismiss">🗙</span>
        <pre class="error-details" hidden></pre>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/boot.js"></script>
    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/taskboard.js"></script>
    <script src="lib/xterm/xterm.js"></script>
    <script src="lib/highlight/highlight.min.js"></script>
    <script src="lib/xterm/xterm-addon-fit.js"></script>
    <script src="js/terminal.js"></script>
    <script src="_content/Blazor.Bootstrap/blazor.bootstrap.js"></script>
</body>

</html>
